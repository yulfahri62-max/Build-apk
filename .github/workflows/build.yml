name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # ==========================================================
      # NODE.JS
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ==========================================================
      # DOWNLOAD ZIP
      # ==========================================================
      - name: Download ZIP project
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          set -e

          echo "=========================================="
          echo "        DOWNLOAD ZIP PROJECT"
          echo "=========================================="

          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong!"
            exit 1
          fi

          echo "URL: $ZIP_URL"

          rm -f project.zip

          curl \
            --fail \
            --location \
            --show-error \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot/1.0" \
            "$ZIP_URL" \
            --output project.zip

          echo ""
          echo "=== FILE INFO ==="
          ls -lh project.zip

          echo ""
          echo "=== FILE TYPE ==="
          file project.zip

          echo ""
          echo "=== FIRST BYTES ==="
          xxd -l 32 project.zip || true

          echo ""
          echo "=== ZIP VALIDATION ==="

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File yang didownload bukan ZIP valid!"
            echo ""
            echo "Isi awal file:"
            head -c 500 project.zip || true
            exit 1
          fi

          echo "✅ ZIP VALID"

      # ==========================================================
      # EXTRACT ZIP
      # ==========================================================
      - name: Extract ZIP
        run: |
          set -e

          echo "=========================================="
          echo "             EXTRACT PROJECT"
          echo "=========================================="

          rm -rf project_raw
          mkdir -p project_raw

          unzip -q project.zip -d project_raw

          echo ""
          echo "=== PROJECT CONTENT ==="
          find project_raw -maxdepth 2 -type f | head -100

          echo ""
          echo "=== DETECTING PROJECT ROOT ==="

          SUB_DIR_COUNT=$(find project_raw -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -mindepth 1 -maxdepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "❌ Project directory tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # CHECK PROJECT
      # ==========================================================
      - name: Check Project Structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "          PROJECT STRUCTURE"
          echo "=========================================="

          pwd
          echo ""

          ls -la

          echo ""

          if [ -f "pubspec.yaml" ]; then
            echo "✅ Flutter project terdeteksi"
          elif [ -f "gradlew" ]; then
            echo "✅ Native Android project terdeteksi"
          elif [ -d "android" ] && [ -f "android/gradlew" ]; then
            echo "✅ Android project terdeteksi"
          else
            echo "❌ Tidak menemukan pubspec.yaml atau gradlew!"
            exit 1
          fi

      # ==========================================================
      # JAVA
      # ==========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================================
      # FLUTTER
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      # ==========================================================
      # FLUTTER DOCTOR
      # ==========================================================
      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      # ==========================================================
      # ANALYZE
      # ==========================================================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "          CODE ANALYSIS"
          echo "=========================================="

          if [ -f "pubspec.yaml" ]; then
            echo "Menjalankan flutter analyze..."

            flutter analyze > analyze_report.txt 2>&1 || true

            echo ""
            echo "========== ANALYZE RESULT =========="
            cat analyze_report.txt
            echo "========== END ANALYZE =========="

            rm -f analyze_report.txt
          else
            echo "Native Android project."
            echo "Flutter analyze dilewati."
          fi

      # ==========================================================
      # STOP ANALYZE ONLY
      # ==========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "=========================================="
          echo "          ANALYZE ONLY MODE"
          echo "=========================================="

          echo "Analyze selesai."
          echo "Workflow dihentikan karena only_analyze=true."

          exit 0

      # ==========================================================
      # FLUTTER PUB GET
      # ==========================================================
      - name: Get Flutter Dependencies
        if: ${{ hashFiles('**/pubspec.yaml') != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "          FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

      # ==========================================================
      # BUILD APK
      # ==========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -e

          echo "=========================================="
          echo "             BUILD APK"
          echo "=========================================="

          echo "Build mode: $BUILD_TYPE"

          if [ -f "pubspec.yaml" ]; then

            echo "🔥 Flutter project detected."

            if [ "$BUILD_TYPE" = "debug" ]; then
              flutter build apk --debug
            else
              flutter build apk --release
            fi

          elif [ -f "gradlew" ]; then

            echo "☕ Native Android project detected."

            chmod +x gradlew

            if [ "$BUILD_TYPE" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi

          elif [ -f "android/gradlew" ]; then

            echo "☕ Flutter/Android project with nested Gradle detected."

            cd android

            chmod +x gradlew

            if [ "$BUILD_TYPE" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi

          else

            echo "❌ gradlew dan pubspec.yaml tidak ditemukan!"
            exit 1

          fi

      # ==========================================================
      # FIND APK
      # ==========================================================
      - name: Find APK
        run: |
          set -e

          echo "=========================================="
          echo "             APK SCANNER"
          echo "=========================================="

          echo "Mencari APK..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          APK_FOUND=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo ""
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi

          APK_PATH="${APK_FOUND#$GITHUB_WORKSPACE/}"

          echo ""
          echo "✅ APK ditemukan:"
          echo "$APK_PATH"

          echo ""
          echo "=== APK SIZE ==="
          ls -lh "$APK_FOUND"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================================
      # UPLOAD APK ARTIFACT
      # ==========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ github.workspace }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error

      # ==========================================================
      # FINAL
      # ==========================================================
      - name: Build Complete
        run: |
          echo "=========================================="
          echo "             BUILD SUCCESS"
          echo "=========================================="

          echo "Tag       : ${{ github.event.inputs.tag }}"
          echo "Build Type: ${{ github.event.inputs.build_type }}"
          echo "APK       : ${{ env.APK_PATH }}"

          echo ""
          echo "✅ APK berhasil dibuat."
          echo "=========================================="
