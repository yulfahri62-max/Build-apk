name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project"
        required: true
        type: string
      tag:
        description: "Tag"
        required: true
        type: string
      build_type:
        description: "debug atau release"
        required: true
        default: "debug"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Download ZIP
        run: |
          wget "${{ github.event.inputs.zip_url }}" -O project.zip

      - name: Extract ZIP
        run: |
          unzip project.zip -d project

      - name: Find Gradle project
        run: |
          cd project
          ROOT=$(find . -name gradlew | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "gradlew tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$ROOT")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk
