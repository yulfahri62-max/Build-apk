name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

      only_analyze:
        description: "Hanya jalankan analyze"
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ============================================================
      # DEFAULT ENV
      # ============================================================

      - name: Set Default Env
        run: |
          echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE"

      # ============================================================
      # DOWNLOAD ZIP
      # ============================================================

      - name: Download ZIP Project
        run: |
          set -e

          echo "========================================"
          echo "Downloading Flutter Project"
          echo "========================================"

          echo "URL:"
          echo "${{ inputs.zip_url }}"

          curl -fL \
            "${{ inputs.zip_url }}" \
            -o project.zip

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== ZIP Validation ==="

          if ! unzip -t project.zip >/dev/null 2>&1; then
            echo "ERROR: project.zip bukan ZIP yang valid."
            exit 1
          fi

          echo "ZIP valid."

      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract ZIP
        run: |
          set -e

          rm -rf project_raw

          mkdir -p project_raw

          unzip -q project.zip -d project_raw

          echo "=== Project Contents ==="

          find project_raw \
            -maxdepth 2 \
            -type f \
            | head -100

          SUB_DIR_COUNT=$(find project_raw \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | wc -l)

          FILE_COUNT=$(find project_raw \
            -maxdepth 1 \
            -mindepth 1 \
            -type f \
            | wc -l)

          echo "SUB_DIR_COUNT=$SUB_DIR_COUNT"
          echo "FILE_COUNT=$FILE_COUNT"

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # ============================================================
      # FLUTTER VERSION
      # ============================================================

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Analyze Project
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then

            echo "========================================"
            echo "Flutter Analyze"
            echo "========================================"

            flutter analyze || true

          else

            echo "pubspec.yaml tidak ditemukan."
            echo "Analyze Flutter dilewati."

          fi

      # ============================================================
      # STOP ANALYZE ONLY
      # ============================================================

      - name: Stop Analyze Only
        if: ${{ inputs.only_analyze == true }}
        run: |
          echo "Analyze-only selesai."
          exit 0

      # ============================================================
      # FLUTTER DEPENDENCIES
      # ============================================================

      - name: Get Flutter Dependencies
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then

            echo "Running flutter pub get..."

            flutter pub get

          else

            echo "pubspec.yaml tidak ditemukan."
            echo "Flutter pub get dilewati."

          fi

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        id: build_apk
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e

          BUILD_EXIT=0

          # --------------------------------------------------------
          # FLUTTER PROJECT
          # --------------------------------------------------------

          if [ -f "pubspec.yaml" ]; then

            echo "========================================"
            echo "Flutter project detected"
            echo "========================================"

            if [ "${{ inputs.build_type }}" = "debug" ]; then

              flutter build apk --debug

              BUILD_EXIT=$?

            else

              flutter build apk --release

              BUILD_EXIT=$?

            fi

          # --------------------------------------------------------
          # NATIVE ANDROID PROJECT
          # --------------------------------------------------------

          else

            echo "========================================"
            echo "Native Android project detected"
            echo "========================================"

            GRADLE_PATH=$(find . \
              -name "gradlew" \
              -type f \
              | head -n 1)

            if [ -z "$GRADLE_PATH" ]; then

              echo "gradlew tidak ditemukan."

              BUILD_EXIT=1

            else

              echo "Gradle wrapper:"
              echo "$GRADLE_PATH"

              chmod +x "$GRADLE_PATH"

              GRADLE_DIR=$(dirname "$GRADLE_PATH")

              cd "$GRADLE_DIR"

              SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

              if [ -n "$SDK_ROOT" ]; then
                echo "sdk.dir=$SDK_ROOT" > local.properties
              fi

              if [ "${{ inputs.build_type }}" = "debug" ]; then

                ./gradlew \
                  assembleDebug \
                  --stacktrace \
                  --no-daemon

                BUILD_EXIT=$?

              else

                ./gradlew \
                  assembleRelease \
                  --stacktrace \
                  --no-daemon

                BUILD_EXIT=$?

              fi

            fi

          fi

          echo "BUILD_EXIT=$BUILD_EXIT"

          echo "build_step_exit=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          exit 0

      # ============================================================
      # CHECK MAIN APK
      # ============================================================

      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "Searching APK"
          echo "========================================"

          APK_FOUND=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -n "$APK_FOUND" ]; then

            echo "APK ditemukan:"
            echo "$APK_FOUND"

            APK_PATH="${APK_FOUND#$GITHUB_WORKSPACE/}"

            echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          else

            echo "Tidak ada APK dari build utama."

          fi

      # ============================================================
      # FALLBACK APK
      # ============================================================

      - name: Create Fallback APK
        if: ${{ always() && env.APK_PATH == '' }}
        run: |
          set +e

          echo "========================================"
          echo "Creating fallback APK"
          echo "========================================"

          FALLBACK_DIR="$GITHUB_WORKSPACE/__fallback_apk"

          rm -rf "$FALLBACK_DIR"

          mkdir -p "$FALLBACK_DIR"

          cd "$FALLBACK_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK tidak ditemukan."
            exit 0
          fi

          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          PLATFORM_DIR=$(find "$SDK_ROOT/platforms" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "Build tools tidak ditemukan."
            exit 0
          fi

          if [ -z "$PLATFORM_DIR" ]; then
            echo "Android platform tidak ditemukan."
            exit 0
          fi

          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ANDROID_JAR="$PLATFORM_DIR/android.jar"

          mkdir -p res/values

          # --------------------------------------------------------
          # STRINGS XML
          # --------------------------------------------------------

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="app_name">Build Fallback</string>' \
            '</resources>' \
            > res/values/strings.xml

          # --------------------------------------------------------
          # MANIFEST
          # --------------------------------------------------------

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    package="com.fallback.placeholder">' \
            '    <uses-sdk' \
            '        android:minSdkVersion="21"' \
            '        android:targetSdkVersion="34" />' \
            '    <application' \
            '        android:label="@string/app_name"' \
            '        android:hasCode="false" />' \
            '</manifest>' \
            > AndroidManifest.xml

          # --------------------------------------------------------
          # AAPT2 COMPILE
          # --------------------------------------------------------

          "$AAPT2" compile \
            --dir res \
            -o compiled.zip

          if [ $? -ne 0 ]; then
            echo "aapt2 compile gagal."
            exit 0
          fi

          # --------------------------------------------------------
          # AAPT2 LINK
          # --------------------------------------------------------

          "$AAPT2" link \
            -o placeholder-unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            -R compiled.zip \
            --auto-add-overlay

          if [ $? -ne 0 ]; then
            echo "aapt2 link gagal."
            exit 0
          fi

          # --------------------------------------------------------
          # KEYSTORE
          # --------------------------------------------------------

          keytool \
            -genkeypair \
            -v \
            -keystore placeholder.keystore \
            -alias placeholder \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass placeholder123 \
            -keypass placeholder123 \
            -dname "CN=Fallback"

          if [ $? -ne 0 ]; then
            echo "keytool gagal."
            exit 0
          fi

          # --------------------------------------------------------
          # ZIPALIGN
          # --------------------------------------------------------

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            placeholder-unsigned.apk \
            placeholder-aligned.apk

          if [ $? -ne 0 ]; then
            echo "zipalign gagal."
            exit 0
          fi

          # --------------------------------------------------------
          # SIGN APK
          # --------------------------------------------------------

          "$APKSIGNER" sign \
            --ks placeholder.keystore \
            --ks-pass pass:placeholder123 \
            --key-pass pass:placeholder123 \
            --out "$GITHUB_WORKSPACE/placeholder-fallback.apk" \
            placeholder-aligned.apk

          if [ -f "$GITHUB_WORKSPACE/placeholder-fallback.apk" ]; then

            echo "Fallback APK berhasil dibuat."

            echo "APK_PATH=placeholder-fallback.apk" >> "$GITHUB_ENV"

          else

            echo "Fallback APK gagal dibuat."

          fi

      # ============================================================
      # FINAL APK CHECK
      # ============================================================

      - name: Final APK Check
        if: always()
        run: |
          echo "========================================"
          echo "Final APK Check"
          echo "========================================"

          APK_FOUND=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FOUND" ]; then

            echo "ERROR: Tidak ada APK."

            exit 1

          fi

          echo "APK:"
          echo "$APK_FOUND"

          APK_PATH="${APK_FOUND#$GITHUB_WORKSPACE/}"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          ls -lh "$APK_FOUND"

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
